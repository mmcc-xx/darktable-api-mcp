# Runs the README's Quick start on clean machines, for both branches of the
# darktable fork: build dependencies, clone and build, MCP server, library
# copy, web app (tests/readme_quickstart.py).
name: README quick start

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 2"        # Tuesdays: after the Monday merge of darktable master has been tested on the Mac and pushed
  push:
    branches: [main]
    paths: [README.md, tests/readme_quickstart.py, .github/workflows/quickstart.yml]

permissions:
  contents: read
  issues: write     # the report job's issue
  actions: read     # which jobs failed

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04    # a clean Ubuntu, not the runner's preinstalled one
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        branch: [darktable-api-5.6, darktable-api]
    steps:
      # what a desktop Ubuntu has before the README starts (and curl for the test)
      - run: apt-get update && apt-get install -y sudo git python3 ca-certificates curl
      - uses: actions/checkout@v4
      - run: python3 tests/readme_quickstart.py --platform ubuntu --branch ${{ matrix.branch }}
               --home "$RUNNER_TEMP/home" --mcp-src "$GITHUB_WORKSPACE"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.branch }}-logs
          path: ${{ runner.temp }}/home/*.log
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest      # Apple Silicon; Homebrew has no bottles for macOS 14 any more
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        branch: [darktable-api-5.6, darktable-api]
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/readme_quickstart.py --platform macos --branch ${{ matrix.branch }}
               --home "$RUNNER_TEMP/home" --mcp-src "$GITHUB_WORKSPACE"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.branch }}-logs
          path: ${{ runner.temp }}/home/*.log
          if-no-files-found: ignore

  # a scheduled or manual run that failed opens an issue here (or comments
  # on the open one), so it isn't only an email; a push's failure is seen
  # by whoever pushed
  report:
    needs: [ubuntu, macos]
    if: failure() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          title="README quick start failed"
          { echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (logs in its artifacts)"
            echo; echo "Failed:"
            gh run view ${{ github.run_id }} -R "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name'; } > issue.md
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body-file issue.md
          else gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file issue.md; fi
